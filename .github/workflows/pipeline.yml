name: Horse Racing Pipeline

on:
  schedule:
    - cron: '0 8,10,12-16 * * *'
  workflow_dispatch:  

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    # Grants explicit write permissions to this job
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Data Fetcher
      env:
        RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
        BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
        BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
      run: python fetch_data.py

    - name: Run Model Training & Prediction
      run: python train_model.py

    - name: Commit and push updated predictions back to repo
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git fetch origin main
        git reset --mixed origin/main
        git add model_predictions.csv
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automated prediction update [skip ci]" && git push origin main)
